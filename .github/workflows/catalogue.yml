name: Build institution catalogue
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Import official RS data, Import extended RS snapshots]
    types: [completed]
  push:
    paths:
      - scripts/build_catalogue.py
      - .github/workflows/catalogue.yml
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: institution-catalogue
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: test -f data/evidence/manifest.json || python3 scripts/hydrate_evidence.py
      - run: python3 scripts/check_live_inventory.py
      - run: python3 scripts/check_official_csv.py
      - run: python3 scripts/build_catalogue.py
      - run: python3 scripts/check_catalogue.py
      - name: Save assembled catalogue
        run: |
          git config user.name 'govbizlist-data-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/catalogue data/evidence data/live data/official-checks
          if ! git diff --cached --quiet; then
            git commit -m 'Assemble complete same-year records into institution-first catalogue'
            git pull --rebase origin main
            git push
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
        id: deployment
